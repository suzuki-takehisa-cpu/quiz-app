<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコード一覧(印刷用)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: "Hiragino Maru Gothic ProN", "Meiryo", sans-serif; color: #1E4D6B; padding: 20px; }
    #list { display: flex; flex-wrap: wrap; gap: 32px; }
    .card { text-align: center; page-break-inside: avoid; }
    .card p { font-size: 1.2rem; font-weight: bold; margin: 0 0 8px; }
    .card small { display: block; margin-top: 6px; font-size: .75rem; word-break: break-all; max-width: 180px; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <p class="no-print">このページを印刷すると、問題ごとのQRコードが出せます。</p>
  <div id="list"></div>

  <script>
    // ↓ 自分のGitHub PagesのURLに書き換える(最後の / を忘れずに)
    const baseURL = "https://ユーザー名.github.io/quiz-app/";
    const total = 3; // 問題数(index.html の問題数と合わせる)

    for (let n = 1; n <= total; n++) {
      const url = `${baseURL}?q=${n}`;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<p>第${n}問</p>`;
      const qr = document.createElement("div");
      card.appendChild(qr);
      card.insertAdjacentHTML("beforeend", `<small>${url}</small>`);
      document.getElementById("list").appendChild(card);
      new QRCode(qr, { text: url, width: 180, height: 180 });
    }
  </script>
</body>
</html>
