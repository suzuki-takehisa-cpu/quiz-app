<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クイズ</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E4D6B;
      --sun: #F2C14E;
      --bg: #EEF3F7;
      --card: #FFFFFF;
      --ok: #2E8B57;
      --ng: #C8553D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; justify-content: center; padding: 24px 16px;
    }
    main { width: 100%; max-width: 520px; }
    #progress { font-weight: 500; opacity: .7; margin: 0 0 4px; }
    #question { font-size: 1.6rem; font-weight: 800; margin: 0 0 16px; line-height: 1.4; }

    /* 問題の画像(1枚) */
    #qimage {
      display: block; width: 100%; max-height: 280px; object-fit: contain;
      background: var(--card); border-radius: 16px; padding: 8px; margin: 0 0 20px;
    }

    /* 選択肢:共通 */
    .choice {
      background: var(--card); border: 4px solid transparent; border-radius: 16px;
      color: var(--ink); font: inherit; cursor: pointer; transition: transform .1s;
    }
    .choice:hover { transform: scale(1.02); }
    .choice:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
    .choice.correct { border-color: var(--ok); }
    .choice.wrong   { border-color: var(--ng); opacity: .6; }
    .choice:disabled { cursor: default; transform: none; }

    /* 選択肢:文章のとき(縦に並べる) */
    #choices.text { display: flex; flex-direction: column; gap: 10px; }
    #choices.text .choice { padding: 14px 18px; font-size: 1.1rem; font-weight: 500; text-align: left; }

    /* 選択肢:画像のとき(2列のグリッド) */
    #choices.image { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #choices.image .choice {
      padding: 8px; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
    }
    #choices.image .choice img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }

    #message { font-size: 1.3rem; font-weight: 800; min-height: 2em; margin: 20px 0 8px; text-align: center; }
    #message.ok { color: var(--ok); }
    #message.ng { color: var(--ng); }

    #explain {
      background: var(--card); border-left: 6px solid var(--sun);
      border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; line-height: 1.7;
    }
    #explain img {
  display: block; width: 100%; max-height: 240px; object-fit: contain;
  border-radius: 8px; margin: 0 0 10px;
}
#explain p { margin: 0; }

    .action {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 999px;
      background: var(--ink); color: #fff; font: inherit; font-weight: 800; font-size: 1.1rem; cursor: pointer;
    }
    .action:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .choice { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p id="progress"></p>
    <h1 id="question"></h1>
    <img id="qimage" alt="" hidden>
    <div id="choices"></div>
    <p id="message"></p>
    <div id="explain" hidden>
        <img id="explainImg" alt="" hidden>
          <p id="explainText"></p>
        </div>
    <button id="next" class="action" hidden>次の問題へ</button>
    <button id="retry" class="action" hidden>もう一度挑戦する</button>
  </main>

  <script>
    // ===== 問題データ =====
    // q        :問題文(必須)
    // img      :問題の画像(なくてもOK)
    // choices  :選択肢。文章でも画像パスでもOK
    // imageChoices: true にすると choices を画像として表示
    // alt      :画像の説明(なくてもOK)
    // answer   :正解の番号(0から数える)
    // explain  :解説文(なくてもOK)
    const quiz = [
      // パターン1:問題文 + 文章の選択肢
      {
        q: "トラザメのおなかの中をどうやってしらべる?",
        choices: ["触診", "エコー検査", "血液検査", "手術"],
        answer: 1,
        explain: "エコー検査でサメを傷つけずにおなかの中をしらべます。",
        explainImg: "images/fuji.jpg",
        explainImgAlt: "エコーの写真"
      },
      // パターン2:問題文 + 画像1枚 + 文章の選択肢
      {
        q: "クロホシイシモチのオスは繁殖期にどこが変化する?",
        img: "images/triangle.svg",
        imgAlt: "クロホシイシモチの画像",
        choices: ["目からビームを出す", "顎が白くなって膨らむ", "頭に星の模様が出現する", "ヒレが大きくなる"],
        answer: 1,
        explain: "膨らませた口の中で卵を保護します。"
      },
      // パターン3:問題文 + 画像の選択肢
      {
        q: "大気海洋研究所の所長は?",
        imageChoices: true,  
        choices: ["images/hyodou1.jpg", "images/hyodo2.png", "images/hyoudo3.png", "images/hyodou4.jpg"],
        alt:     ["太陽", "星", "黄色い丸", "三日月"],
        answer: 2,
        explain: "1ルイス・クー, 2.大杉連, 4.兵藤晋(教授)"
      }
    ];

    // ===== 状態 =====
    let current = 0;
    let score = 0;

    // URLの ?q=番号 で1問だけ出すモード(QRコード用)
    const qNum = parseInt(new URLSearchParams(location.search).get("q"));
    const singleMode = !isNaN(qNum) && qNum >= 1 && qNum <= quiz.length;
    if (singleMode) current = qNum - 1;

    const $ = id => document.getElementById(id);

    // ===== 問題を表示 =====
    function showQuestion() {
      const item = quiz[current];
      $("progress").textContent = singleMode ? `第${current + 1}問` : `${current + 1} / ${quiz.length}問`;
      $("question").textContent = item.q;
      $("message").textContent = "";
      $("message").className = "";
      $("explain").hidden = true;
      $("next").hidden = true;

      // 問題の画像(あるときだけ表示)
      const qimg = $("qimage");
      if (item.img) {
        qimg.src = item.img;
        qimg.alt = item.imgAlt || "問題の画像";
        qimg.hidden = false;
      } else {
        qimg.hidden = true;
        qimg.removeAttribute("src");
      }

      // 選択肢(文章か画像かで並べ方を変える)
      const box = $("choices");
      box.innerHTML = "";
      box.className = item.imageChoices ? "image" : "text";

      item.choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.className = "choice";

        if (item.imageChoices) {
          const img = document.createElement("img");
          img.src = choice;
          img.alt = item.alt ? item.alt[i] : `選択肢${i + 1}`;
          img.onerror = () => { btn.textContent = `画像が見つかりません:${choice}`; };
          btn.appendChild(img);
        } else {
          btn.textContent = choice;
        }

        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
      });
    }

    // ===== 答えを判定 =====
    function checkAnswer(i) {
      const item = quiz[current];
      const buttons = $("choices").querySelectorAll(".choice");
      buttons.forEach(b => b.disabled = true);
      buttons[item.answer].classList.add("correct");

      if (i === item.answer) {
        score++;
        $("message").textContent = "正解!";
        $("message").className = "ok";
      } else {
        buttons[i].classList.add("wrong");
        $("message").textContent = "残念、緑の枠が正解です";
        $("message").className = "ng";
      }

      if (item.explain || item.explainImg) {
  $("explainText").textContent = item.explain || "";

  const eimg = $("explainImg");
  if (item.explainImg) {
    eimg.src = item.explainImg;
    eimg.alt = item.explainImgAlt || "解説の画像";
    eimg.hidden = false;
  } else {
    eimg.hidden = true;
    eimg.removeAttribute("src");
  }

  $("explain").hidden = false;
}

      if (!singleMode) {
        $("next").textContent = current + 1 < quiz.length ? "次の問題へ" : "結果を見る";
        $("next").hidden = false;
      }
    }

    // ===== 次へ / 結果 =====
    $("next").onclick = () => {
      current++;
      if (current < quiz.length) {
        showQuestion();
      } else {
        $("progress").textContent = "結果";
        $("question").textContent = `${quiz.length}問中 ${score}問正解`;
        $("qimage").hidden = true;
        $("choices").innerHTML = "";
        $("explain").hidden = true;
        $("message").textContent = score === quiz.length ? "全問正解です!" : "";
        $("message").className = "ok";
        $("next").hidden = true;
        $("retry").hidden = false;
      }
    };

    $("retry").onclick = () => {
      current = 0; score = 0;
      $("retry").hidden = true;
      showQuestion();
    };

    showQuestion();
  </script>
</body>
</html>
