<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像クイズ</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E4D6B;      /* 文字・メイン色 */
      --sun: #F2C14E;      /* アクセント */
      --bg: #EEF3F7;       /* 背景 */
      --card: #FFFFFF;
      --ok: #2E8B57;       /* 正解 */
      --ng: #C8553D;       /* 不正解 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; justify-content: center; padding: 24px 16px;
    }
    main { width: 100%; max-width: 520px; }
    #progress { font-weight: 500; opacity: .7; margin: 0 0 4px; }
    #question { font-size: 1.6rem; font-weight: 800; margin: 0 0 20px; line-height: 1.4; }

    /* 画像の選択肢:2列のグリッド */
    #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice {
      background: var(--card); border: 4px solid transparent; border-radius: 16px;
      padding: 8px; cursor: pointer; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s;
    }
    .choice:hover { transform: scale(1.03); }
    .choice:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
    .choice img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
    .choice.correct { border-color: var(--ok); }
    .choice.wrong   { border-color: var(--ng); opacity: .6; }
    .choice:disabled { cursor: default; transform: none; }

    #message { font-size: 1.3rem; font-weight: 800; min-height: 2em; margin: 20px 0 8px; text-align: center; }
    #message.ok { color: var(--ok); }
    #message.ng { color: var(--ng); }

    .action {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 999px;
      background: var(--ink); color: #fff; font: inherit; font-weight: 800; font-size: 1.1rem; cursor: pointer;
    }
    .action:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .choice { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p id="progress"></p>
    <h1 id="question"></h1>
    <div id="choices"></div>
    <p id="message"></p>
    <button id="next" class="action" hidden>次の問題へ</button>
    <button id="retry" class="action" hidden>もう一度挑戦する</button>
  </main>

  <script>
    // ===== 問題データ =====
    // choices:選択肢の画像パス / alt:画像の説明(読み上げ・画像が出ないとき用)
    // answer:正解の番号(0から数える)
    const quiz = [
      {
        q: "トラザメじゃないのはどれ?",
        choices: ["images/トラ1.png", "images/トラ2.png", "images/ドチ1.png", "images/トラ3.png"],
        alt:     ["青い丸", "赤い丸", "黄色い丸", "紺色の丸"],
        answer: 2
      },
      {
        q: "大気海洋研究所の所長は?",
        choices: ["images/hyodou1.jpg", "images/hyodo2.png", "images/hyodou3.png", "images/hyodou4.jpg"],
        alt:     ["四角形", "円", "三角形", "星"],
        answer: 1
      },
      {
        q: "夜空に見える月はどれ?",
        choices: ["images/sun.svg", "images/star.svg", "images/yellow.svg", "images/moon.svg"],
        alt:     ["太陽", "星", "黄色い丸", "三日月"],
        answer: 3
      }
    ];

    // ===== 状態 =====
    let current = 0;
    let score = 0;

    // URLの ?q=番号 で1問だけ出すモード(QRコード用)
    const qNum = parseInt(new URLSearchParams(location.search).get("q"));
    const singleMode = !isNaN(qNum) && qNum >= 1 && qNum <= quiz.length;
    if (singleMode) current = qNum - 1;

    const $ = id => document.getElementById(id);

    // ===== 問題を表示 =====
    function showQuestion() {
      const item = quiz[current];
      $("progress").textContent = singleMode ? `第${current + 1}問` : `${current + 1} / ${quiz.length}問`;
      $("question").textContent = item.q;
      $("message").textContent = "";
      $("message").className = "";
      $("next").hidden = true;

      const box = $("choices");
      box.innerHTML = "";
      item.choices.forEach((src, i) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        const img = document.createElement("img");
        img.src = src;
        img.alt = item.alt ? item.alt[i] : `選択肢${i + 1}`;
        // 画像が見つからないときはファイル名を表示
        img.onerror = () => { btn.textContent = `画像が見つかりません:${src}`; };
        btn.appendChild(img);
        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
      });
    }

    // ===== 答えを判定 =====
    function checkAnswer(i) {
      const item = quiz[current];
      const buttons = $("choices").querySelectorAll(".choice");
      buttons.forEach(b => b.disabled = true);       // 二度押し防止
      buttons[item.answer].classList.add("correct"); // 正解に緑の枠

      if (i === item.answer) {
        score++;
        $("message").textContent = "正解!";
        $("message").className = "ok";
      } else {
        buttons[i].classList.add("wrong");
        $("message").textContent = "残念、緑の枠が正解です";
        $("message").className = "ng";
      }

      if (!singleMode) {
        $("next").textContent = current + 1 < quiz.length ? "次の問題へ" : "結果を見る";
        $("next").hidden = false;
      }
    }

    // ===== 次へ / 結果 =====
    $("next").onclick = () => {
      current++;
      if (current < quiz.length) {
        showQuestion();
      } else {
        $("progress").textContent = "結果";
        $("question").textContent = `${quiz.length}問中 ${score}問正解`;
        $("choices").innerHTML = "";
        $("message").textContent = score === quiz.length ? "全問正解です!" : "";
        $("message").className = "ok";
        $("next").hidden = true;
        $("retry").hidden = false;
      }
    };

    $("retry").onclick = () => {
      current = 0; score = 0;
      $("retry").hidden = true;
      showQuestion();
    };

    showQuestion();
  </script>
</body>
</html>
